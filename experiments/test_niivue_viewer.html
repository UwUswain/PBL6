<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBL6 - NIfTI & Mask Viewer (Niivue)</title>
    <!-- Tải trực tiếp thư viện Niivue từ CDN -->
    <script src="https://unpkg.com/@niivue/niivue@latest/dist/niivue.umd.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 20px; }
        .upload-section { margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; }
        .upload-section input { margin-right: 30px; }
        /* Khung canvas để render 3D/2D */
        canvas { width: 100%; height: 650px; background: #000; display: block; border: 1px solid #444;}
    </style>
</head>
<body>
    <h2>PBL6: NIfTI Brain Viewer</h2>
    
    <div class="upload-section">
        <label><b>1. NIfTI Gốc (MRI/CT):</b></label>
        <input type="file" id="baseFile" accept=".nii,.nii.gz">
        
        <label><b>2. NIfTI Mask (Phân đoạn):</b></label>
        <input type="file" id="maskFile" accept=".nii,.nii.gz">
    </div>

    <canvas id="gl"></canvas>

    <script>
        // Khởi tạo Niivue và gắn vào thẻ canvas
        const nv = new niivue.Niivue({
            dragAndDropEnabled: true,
            backColor: [0, 0, 0, 1] // Nền đen
        });
        nv.attachTo('gl');

        // Xử lý Upload file NIfTI gốc
        document.getElementById('baseFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Xóa ảnh cũ nếu chọn lại file khác
            if (nv.volumes.length > 0) nv.volumes = [];

            const image = await niivue.NVImage.loadFromFile({
                file: file,
                name: "base-image",
                colormap: "gray" 
            });
            nv.addVolume(image);
        });

        // Xử lý Upload file NIfTI Mask
        document.getElementById('maskFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const mask = await niivue.NVImage.loadFromFile({
                file: file,
                name: "mask-image",
                colormap: "red", // Mask màu đỏ
                opacity: 0.5     // Độ trong suốt 50%
            });
            nv.addVolume(mask);
        });
    </script>
</body>
</html>
