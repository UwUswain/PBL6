# Kaggle GPU Configuration - Dual-Encoder SegResNet V4
# SOTA Micro-Lesion Aware Pipeline (100 Epochs, Component-Aware Sampling, Deep Supervision, BiCrossAttention)

experiment:
  model_name: "dual_segresnet"
  in_channels: 2
  init_filters: 32
  fusion_mode: "bidirectional"
  deep_supervision: true
  sampling_mode: "component_aware"
  max_epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.01
  loss: "dice_focal"
  loss_gamma: 2.0
  val_interval: 1
  postprocess_min_size: 0
  postprocess_min_ml: 0.008

data:
  modalities: ["dwi", "adc"]
  roi_size: [96, 96, 64]
  batch_size: 2
  num_workers: 4
  use_cache: true
  cache_rate: 1.0
  sampling_mode: "component_aware"

