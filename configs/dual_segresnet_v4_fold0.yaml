# Dual-Encoder SegResNet V4 (PBL6 SOTA - Micro-Lesion Aware Pipeline)
# Informed by NVIDIA NVAUTO (Paper 22: 5-Fold SegResNet + Deep Supervision)
# & Rahman et al. (Paper 9: Boundary-preserving focal loss)
# 1. Capacity: init_filters=32 (channels: 32 -> 64 -> 128 -> 256)
# 2. Interaction: Bidirectional Cross-Modality Attention (BiCrossAttention)
# 3. Micro-Lesion Sampling: Component-Aware Cropping (balanced 1/K island oversampling)
# 4. Multi-Scale Deep Supervision: Multi-level 1x1x1 conv decoder taps (decay 2^-i)
# 5. Loss: DiceFocalLoss (gamma=2.0)
# 6. Post-processing: Physical Volume Aware Connected-Component Filtering (min_size_ml: 0.008)

experiment:
  model_name: "dual_segresnet"
  in_channels: 2
  init_filters: 32
  fusion_mode: "bidirectional"
  deep_supervision: true
  sampling_mode: "component_aware"
  max_epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.01
  loss: "dice_focal"
  loss_gamma: 2.0
  val_interval: 1
  postprocess_min_size: 0
  postprocess_min_ml: 0.008

data:
  modalities: ["dwi", "adc"]
  roi_size: [96, 96, 64]
  batch_size: 2
  num_workers: 4
  use_cache: true
  cache_rate: 1.0
  sampling_mode: "component_aware"

