# Kaggle GPU (T4 x2 - 16GB VRAM & 30GB RAM) Configuration
# Fully aligned with Paper 32 (Factorizer): DiceCELoss, Weight Decay 0.01, Stable LR

experiment:
  model_name: "dual_segresnet"
  in_channels: 2
  max_epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.01
  loss: "dice_ce"

data:
  modalities: ["dwi", "adc"]
  roi_size: [96, 96, 64]
  batch_size: 2
  num_workers: 4
  use_cache: true
  cache_rate: 1.0
