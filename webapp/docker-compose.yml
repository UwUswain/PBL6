# PBL6 platform: one command from this folder:  docker compose up -d --build
# Then open http://localhost:8080
# Memory caps keep the laptop under ~90% RAM (16 GB machine shared with the IDE and browser).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pbl6
      POSTGRES_USER: pbl6
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in webapp/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbl6 -d pbl6"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pbl6:${POSTGRES_PASSWORD}@db:5432/pbl6
      JWT_KEY_DIR: /srv/keys
      DATA_DIR: /srv/data
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in webapp/.env}
    volumes:
      - jwtkeys:/srv/keys  # RSA signing key survives restarts, so sessions do too
      - casedata:/srv/data  # uploads (api) and masks (worker)
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"  # localhost only; the legacy web/ demo keeps port 8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  worker:
    build:
      context: ..  # repo root: the image copies src/ and web/ (filtered by worker/Dockerfile.dockerignore)
      dockerfile: webapp/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pbl6:${POSTGRES_PASSWORD}@db:5432/pbl6
      DATA_DIR: /srv/data
    volumes:
      - casedata:/srv/data
      - ../experiments/runs:/srv/app/experiments/runs:ro  # checkpoints named in web/config.yaml
    depends_on:
      api:
        condition: service_healthy  # the api applies migrations first
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 4g
    restart: unless-stopped

volumes:
  pgdata:
  jwtkeys:
  casedata:
