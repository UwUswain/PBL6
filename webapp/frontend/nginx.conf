server {
    listen 80;
    server_name _;
    client_max_body_size 600m;  # uncompressed ISLES FLAIR is ~140 MB; three volumes per case

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: nginx is the only entry point, so the client must not be able to supply
        # its own X-Forwarded-For (that let anyone dodge the login rate limit by changing the header).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        try_files $uri /index.html;
    }
}
